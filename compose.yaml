# Запуск: docker compose up --build   →  http://localhost:8080
# Дополнительно: --profile llm (Ollama, открытые веса), --profile s3 (MinIO вместо локального хранилища)
name: alfa-pulse

x-api-env: &api-env
  APP_ENV: demo
  DATABASE_URL: postgresql+asyncpg://alfa:${POSTGRES_PASSWORD:-alfa-dev-password}@db:5432/alfa
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-change-me-in-real-deployments-0123456789abcdef}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}   # на сервере за HTTPS — true (в .env)
  CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:8080"]}'
  SEED_ON_START: ${SEED_ON_START:-true}    # тестовые аккаунты и демо-заявки (синтетика)
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token}   # доступ к внутренним mock-интеграциям; на сервере — свой
  DEMO_CLIENT_PASSWORD: ${DEMO_CLIENT_PASSWORD:-Demo2026!}
  DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-Alfa2026!}
  CREATE_TABLES_ON_START: "false"  # схема применяется Alembic
  STORAGE_DIR: /srv/data/files
  DADATA_API_KEY: ${DADATA_API_KEY:-}   # поиск реальной компании по ИНН (бесплатный тариф DaData)
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b-instruct}
  ML_BASE_URL: ${ML_BASE_URL:-http://ml:8000}
  COMMIT_SHA: ${COMMIT_SHA:-local}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alfa-dev-password}
      POSTGRES_DB: alfa
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa -d alfa"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  files-init:
    image: busybox:1.37
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /files && chown -R 10001:10001 /files"]
    volumes: [files:/files]
    restart: "no"

  qdrant:
    image: qdrant/qdrant:v1.20.0
    volumes: [qdrant:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20

  ml:
    build: ./ml
    platform: linux/amd64
    volumes:
      - ml_ocr_models:/root/.paddlex
      - ml_embedding_model:/app/model
    environment:
      QDRANT_URL: http://qdrant:6333
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-nvidia/nemotron-3.5-super-vl:free}
    depends_on:
      qdrant: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  api:
    build: ./backend
    environment: *api-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      ml: { condition: service_started }
      files-init: { condition: service_completed_successfully }
    volumes: [files:/srv/data/files]
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["arq", "app.workers.arq_worker.WorkerSettings"]
    environment: *api-env
    depends_on:
      api: { condition: service_healthy }
    volumes: [files:/srv/data/files]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; assert redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build: ./frontend
    ports: ["${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"]
    depends_on: [api]
    restart: unless-stopped

  # ── необязательные профили ──
  ollama:
    profiles: [llm]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]

  minio:
    profiles: [s3]
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-alfaminio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-alfaminio-secret}
    ports: ["9001:9001"]
    volumes: [minio:/data]

volumes:
  pgdata:
  files:
  ollama:
  minio:
  qdrant:
  ml_ocr_models:
  ml_embedding_model:
