[project]
name = "alfa-smart-credit-cabinet"
version = "0.1.0"
description = "Прототип умного кредитного кабинета предпринимателя для АльфаХака"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.7,<1.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.12,<3.0",
    "qdrant-client>=1.17,<2.0",
    "rank-bm25>=0.2.2,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.20,<1",
    "paddleocr[doc-parser]>=3.3,<4",
    "paddlepaddle==3.2.2",
]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=9.0,<10.0",
    "ruff>=0.14,<1.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]
exclude = [".git", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
