name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --no-install-project
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run pytest -q

  ml:
    name: ML
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: ml/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: Clean Docker Compose
    runs-on: ubuntu-latest
    needs: [backend, ml, frontend]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build --wait
      - name: Check API, browser entrypoint and real RAG search
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health/ready > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/openapi.json > /dev/null
          docker compose exec -T ml uv run --no-sync python -c 'import httpx; r=httpx.post("http://127.0.0.1:8000/v1/assistant/search", json={"query":"Какие документы нужны для кредита?","limit":3}, timeout=120); r.raise_for_status(); assert len(r.json()) > 0'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=150
      - name: Stop containers
        if: always()
        run: docker compose down -v
